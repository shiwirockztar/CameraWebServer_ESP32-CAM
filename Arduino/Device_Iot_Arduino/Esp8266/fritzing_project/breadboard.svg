<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Breadboard view SVG (skeleton) - based on wiring.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .node{fill:#fdfdfd;stroke:#333;stroke-width:2}
    .pin{fill:#fff;stroke:#333;stroke-width:1}
    .label{font:13px sans-serif;fill:#111}
    .wire{stroke:#0a58ca;stroke-width:2}
  </style>

  <rect x="30" y="40" width="180" height="340" rx="8" class="node" />
  <text x="120" y="62" text-anchor="middle" class="label">NodeMCU (ESP8266)</text>

  <circle cx="120" cy="110" r="8" class="pin" />
  <text x="150" y="114" class="label">D1 (GPIO5) → TRIG</text>

  <circle cx="120" cy="150" r="8" class="pin" />
  <text x="150" y="154" class="label">D2 (GPIO4) → LED verde</text>

  <circle cx="120" cy="190" r="8" class="pin" />
  <text x="150" y="194" class="label">D4 (GPIO2) → LED rojo (integrado)</text>

  <circle cx="120" cy="230" r="8" class="pin" />
  <text x="150" y="234" class="label">D5 (GPIO14) → Relay IN</text>

  <circle cx="120" cy="270" r="8" class="pin" />
  <text x="150" y="274" class="label">D7 (GPIO13) ← ECHO (usar divisor)</text>

  <circle cx="120" cy="310" r="8" class="pin" />
  <text x="150" y="314" class="label">D8 (GPIO15) → Buzzer</text>

  <rect x="340" y="80" width="180" height="110" rx="6" fill="#fff" stroke="#333" />
  <text x="430" y="100" text-anchor="middle" class="label">HC-SR04</text>
  <text x="430" y="122" class="label">Vcc (3.3/5V)</text>
  <text x="430" y="140" class="label">TRIG</text>
  <text x="430" y="158" class="label">ECHO</text>
  <text x="430" y="176" class="label">GND</text>

  <rect x="340" y="210" width="160" height="80" rx="6" fill="#fff" stroke="#333" />
  <text x="420" y="230" text-anchor="middle" class="label">Relay Module</text>
  <text x="420" y="248" class="label">Vcc</text>
  <text x="420" y="266" class="label">IN (D5)</text>
  <text x="420" y="284" class="label">GND</text>

  <rect x="640" y="200" width="200" height="80" rx="6" fill="#fff" stroke="#333" />
  <text x="740" y="224" text-anchor="middle" class="label">Buzzer</text>
  <text x="740" y="244" class="label">IN (D8) via transistor</text>
  <text x="740" y="264" class="label">GND</text>

  <line x1="128" y1="110" x2="340" y2="140" class="wire" />
  <circle cx="340" cy="140" r="3" fill="#0a58ca" />

  <line x1="128" y1="270" x2="380" y2="158" class="wire" />
  <circle cx="380" cy="158" r="3" fill="#0a58ca" />

  <line x1="128" y1="150" x2="520" y2="100" class="wire" />
  <circle cx="520" cy="100" r="4" fill="#0f0" stroke="#333" />

  <line x1="128" y1="190" x2="520" y2="132" class="wire" stroke-dasharray="4 4" />
  <circle cx="520" cy="132" r="4" fill="#f00" stroke="#333" />

  <line x1="128" y1="230" x2="340" y2="248" class="wire" />
  <circle cx="340" cy="248" r="3" fill="#0a58ca" />

  <line x1="128" y1="310" x2="640" y2="244" class="wire" />
  <circle cx="640" cy="244" r="3" fill="#0a58ca" />

  <text x="20" y="390" font="12px sans-serif" fill="#b21">Nota: usar transistor/divisor de nivel para proteger GPIO; no alimentar relé directamente desde GPIO.</text>

</svg>
